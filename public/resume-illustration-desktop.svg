<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" fill="none" role="img" aria-label="Example of an ATS-friendly resume layout">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.14"/>
    </filter>
    <filter id="chip" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Page -->
  <g filter="url(#shadow)">
    <rect x="40" y="24" width="360" height="466" rx="14" fill="#ffffff"/>
  </g>
  <clipPath id="page"><rect x="40" y="24" width="360" height="466" rx="14"/></clipPath>
  <g clip-path="url(#page)">
    <!-- Header band with accent rule (Executive design) -->
    <rect x="40" y="24" width="360" height="92" fill="#f1f5f9"/>
    <rect x="40" y="114" width="360" height="3" fill="#2563eb"/>
    <rect x="66" y="50" width="150" height="14" rx="3" fill="#0f172a"/>
    <rect x="66" y="72" width="96" height="8" rx="2" fill="#2563eb" opacity="0.75"/>
    <rect x="66" y="90" width="58" height="6" rx="2" fill="#94a3b8"/>
    <rect x="132" y="90" width="72" height="6" rx="2" fill="#94a3b8"/>
    <rect x="212" y="90" width="50" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Summary -->
  <rect x="66" y="140" width="3" height="12" rx="1" fill="#2563eb"/>
  <rect x="76" y="141" width="64" height="9" rx="2" fill="#1e293b"/>
  <rect x="148" y="145.5" width="226" height="1" fill="#e2e8f0"/>
  <rect x="66" y="162" width="308" height="5" rx="2" fill="#cbd5e1"/>
  <rect x="66" y="173" width="290" height="5" rx="2" fill="#cbd5e1"/>
  <rect x="66" y="184" width="210" height="5" rx="2" fill="#cbd5e1"/>

  <!-- Experience -->
  <rect x="66" y="208" width="3" height="12" rx="1" fill="#2563eb"/>
  <rect x="76" y="209" width="84" height="9" rx="2" fill="#1e293b"/>
  <rect x="168" y="213.5" width="206" height="1" fill="#e2e8f0"/>

  <rect x="66" y="230" width="122" height="8" rx="2" fill="#0f172a"/>
  <rect x="318" y="231" width="56" height="6" rx="2" fill="#94a3b8"/>
  <rect x="66" y="244" width="84" height="6" rx="2" fill="#2563eb" opacity="0.6"/>
  <circle cx="70" cy="261" r="2" fill="#2563eb"/>
  <rect x="78" y="258.5" width="280" height="5" rx="2" fill="#cbd5e1"/>
  <circle cx="70" cy="273" r="2" fill="#2563eb"/>
  <rect x="78" y="270.5" width="252" height="5" rx="2" fill="#cbd5e1"/>
  <circle cx="70" cy="285" r="2" fill="#2563eb"/>
  <rect x="78" y="282.5" width="268" height="5" rx="2" fill="#cbd5e1"/>

  <rect x="66" y="302" width="104" height="8" rx="2" fill="#0f172a"/>
  <rect x="318" y="303" width="56" height="6" rx="2" fill="#94a3b8"/>
  <rect x="66" y="316" width="70" height="6" rx="2" fill="#2563eb" opacity="0.6"/>
  <circle cx="70" cy="333" r="2" fill="#2563eb"/>
  <rect x="78" y="330.5" width="262" height="5" rx="2" fill="#cbd5e1"/>
  <circle cx="70" cy="345" r="2" fill="#2563eb"/>
  <rect x="78" y="342.5" width="230" height="5" rx="2" fill="#cbd5e1"/>

  <!-- Education -->
  <rect x="66" y="368" width="3" height="12" rx="1" fill="#2563eb"/>
  <rect x="76" y="369" width="70" height="9" rx="2" fill="#1e293b"/>
  <rect x="154" y="373.5" width="220" height="1" fill="#e2e8f0"/>
  <rect x="66" y="390" width="140" height="8" rx="2" fill="#0f172a"/>
  <rect x="330" y="391" width="44" height="6" rx="2" fill="#94a3b8"/>
  <rect x="66" y="404" width="96" height="6" rx="2" fill="#94a3b8"/>

  <!-- Skills -->
  <rect x="66" y="428" width="3" height="12" rx="1" fill="#2563eb"/>
  <rect x="76" y="429" width="44" height="9" rx="2" fill="#1e293b"/>
  <rect x="128" y="433.5" width="246" height="1" fill="#e2e8f0"/>
  <rect x="66" y="450" width="300" height="5" rx="2" fill="#cbd5e1"/>
  <rect x="66" y="461" width="190" height="5" rx="2" fill="#cbd5e1"/>

  <!-- Floating chips -->
  <g filter="url(#chip)">
    <rect x="296" y="138" width="134" height="36" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="316" cy="156" r="9" fill="#dcfce7"/>
  <path d="M312 156.2l2.8 2.8 5.2-5.6" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="160.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Single column</text>

  <g filter="url(#chip)">
    <rect x="10" y="400" width="128" height="36" rx="18" fill="#ffffff"/>
  </g>
  <rect x="22" y="408" width="20" height="20" rx="5" fill="#dbeafe"/>
  <path d="M28 413h6l3 3v7h-9z" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="50" y="422.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">PDF + Word</text>
</svg>
